<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}中央研究院 採購合約資安審查助手{% endblock %}</title>
    <link rel="stylesheet" href="/static/app.css">
    {% block head %}{% endblock %}
</head>
<body>
    <header>
        <div class="brand">中央研究院 採購合約資安審查助手</div>
        <nav>
            <a href="/cases" class="{% if request.url.path.startswith('/cases') %}active{% endif %}">案件總覽</a>
            <a href="/rules" class="{% if request.url.path.startswith('/rules') %}active{% endif %}">規則與法源</a>
            <a href="/settings" class="{% if request.url.path.startswith('/settings') %}active{% endif %}">系統設定</a>
        </nav>
        <div class="user-info">
            操作者: <span id="operator-badge">{{ operator or 'local_reviewer' }}</span>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <script src="/static/app.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
