[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "procurement-review"
version = "0.1.0"
description = "中央研究院資訊採購合約資安審查助手"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=42.0.0",
    "defusedxml>=0.7.1",
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.0",
    "keyring>=24.0.0",
    "pydantic>=2.7.0",
    "pypdf>=6.20.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.9",
    "uvicorn>=0.29.0",
]

[project.scripts]
procurement-review = "procurement_review.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/procurement_review"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["live: tests communicating with live cloud provider"]


[tool.ruff]
line-length = 100
target-version = "py313"
